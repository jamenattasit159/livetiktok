<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Gift Demo</title>
<style>
:root{--bg:#141417;--paper:#f5f4f0;--ink:#1c1c1f;--line:#d9d7d0;--blue:#0d99ff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
  font-family:"Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
body{display:flex;justify-content:center;padding-top:8px;box-sizing:border-box}
#fit{width:calc(540px*var(--s,1));height:calc(960px*var(--s,1));flex:none}
#stage{width:540px;height:960px;transform:scale(var(--s,1));transform-origin:0 0;position:relative;overflow:hidden;
  border-radius:10px;background:var(--paper) radial-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px}
/* rulers */
#stage::before,#stage::after{content:"";position:absolute;left:0;top:0;background-color:#fff;z-index:3}
#stage::before{right:0;height:14px;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg,#bdbab2 0 1px,transparent 1px 10px)}
#stage::after{bottom:0;width:14px;border-right:1px solid var(--line);
  background-image:repeating-linear-gradient(0deg,#bdbab2 0 1px,transparent 1px 10px)}

#legend{position:absolute;right:12px;top:24px;width:170px;box-sizing:border-box;padding:10px 12px;border-radius:10px;
  background:#1c1c1fe6;color:#fff;font-size:13px;line-height:1.9;z-index:4}
#legend b{float:right;font-weight:600;font-variant-numeric:tabular-nums}
#legend div{margin-top:6px;padding-top:4px;border-top:1px solid #fff3}
.crown{position:absolute;left:0;right:0;top:calc(var(--w)*-.05);text-align:center;font-size:calc(var(--w)*.2);line-height:1;
  transform:translateY(-40px) rotate(-30deg) scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.crown.on{transform:rotate(-8deg)}

.sel{position:absolute;border:1.5px solid var(--blue);box-sizing:border-box;z-index:2;pointer-events:none}
.sel span{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:var(--blue);color:#fff;
  font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap}

.card{position:absolute;background:#fff;border:1px solid #e3e1da;border-radius:calc(var(--w)*.07);box-sizing:border-box;
  box-shadow:0 6px 20px #0000001f;opacity:0;transition:opacity .35s,transform .35s;z-index:1}
.card.in{opacity:1}
.card.out{opacity:0;transform:scale(.9)}
.card.glow{border:2px solid #ff8a00;box-shadow:0 14px 40px #00000033}
.av{position:absolute;border-radius:50%;overflow:hidden;background:#e9e7e1;outline:1.5px solid var(--c)}
.av.show{outline-color:transparent;transition:outline-color .4s}
.av img{display:block;width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 100% 0);transition:clip-path .45s linear}
.av.show img{clip-path:inset(0)}
.nm{position:absolute;left:6%;right:6%;top:calc(var(--w)*.72);text-align:center;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-weight:700;font-size:calc(var(--w)*.1);color:var(--ink)}
.nm.typing span::after{content:"";display:inline-block;width:2px;height:1em;margin-left:1px;background:var(--c);
  vertical-align:-.15em;animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.gf{position:absolute;left:0;right:0;top:calc(var(--w)*.93);text-align:center;font-size:calc(var(--w)*.08);font-weight:600;
  color:var(--c);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.gf.pop{transform:scale(1)}

.cur{position:absolute;left:0;top:0;z-index:5;pointer-events:none;--c:#1c1c1f;opacity:.5;transition:opacity .3s}
.cur.busy{opacity:1}
.cur svg{display:block;filter:drop-shadow(0 1px 2px #0005)}
.cur.ibeam svg{display:none}
.cur.ibeam::before{content:"";position:absolute;left:-1px;top:-10px;width:2px;height:20px;background:var(--c)}
.tag{position:absolute;left:14px;top:18px;background:var(--c);color:#fff;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag:empty{display:none}

#panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:#26262b;padding:8px 10px;border-radius:12px;color:#ddd;font-size:14px;white-space:nowrap}
#panel button{font:inherit;color:#fff;background:#3a3a42;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
#panel button:hover{background:#4a4a55}
#panel button:focus-visible,#panel input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="legend"></div>
</div></div>

<div id="panel"><label><input type="checkbox" id="auto" checked> Auto</label></div>

<script>
const W=540,H=960,stage=document.getElementById('stage');
// w = card width, n = cursors recruited, top = biggest prize (gets the crown). Coins are demo values.
const GIFTS={
  rose:{icon:'🌹',label:'Rose',coins:1,w:130,n:1,color:'#0d99ff'},
  heart:{icon:'🤞',label:'Finger Heart',coins:5,w:150,n:1,color:'#14ae5c'},
  donut:{icon:'🍩',label:'Doughnut',coins:30,w:190,n:2,color:'#9747ff'},
  cap:{icon:'🧢',label:'Cap',coins:99,w:230,n:2,color:'#f24e9e'},
  galaxy:{icon:'🌌',label:'Galaxy',coins:1000,w:300,n:3,color:'#e5484d'},
  lion:{icon:'🦁',label:'Lion',coins:29999,w:380,n:3,color:'#ff8a00',top:true},
};
const ids=Object.keys(GIFTS),tally={},legend=document.getElementById('legend');
function addTally(id,n){
  if(id)tally[id]=(tally[id]||0)+n;
  const total=ids.reduce((s,k)=>s+(tally[k]||0)*GIFTS[k].coins,0);
  legend.innerHTML=ids.map(k=>`${GIFTS[k].icon} ${GIFTS[k].label} <b>${tally[k]||0}</b>`).join('<br>')
    +`<div>รวมเหรียญ <b>${total.toLocaleString()}</b></div>`}
addTally();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(tag,cls,parent)=>{const e=document.createElement(tag);e.className=cls;parent.append(e);return e};
const seg=s=>[...new Intl.Segmenter().segment(s)].map(x=>x.segment); // Thai-safe "characters"
const tween=(ms,f)=>new Promise(r=>{const t0=performance.now();(function st(t){
  const k=Math.min(1,Math.max(0,(t-t0)/ms));f(k<.5?2*k*k:1-2*(1-k)*(1-k));k<1?requestAnimationFrame(st):r()})(t0)});

function fit(){document.documentElement.style.setProperty('--s',Math.min((innerHeight-76)/H,(innerWidth-16)/W))}
addEventListener('resize',fit);fit();

/* ---- sound: tiny synthesized clicks, unlocked by first click ---- */
let ac;addEventListener('pointerdown',()=>{ac??=new AudioContext()},{once:true});
function click(f,d){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(1e-4,t+d);
  o.connect(g).connect(ac.destination);o.start();o.stop(t+d)}

/* ---- cursor swarm: idle ones wander, gifts recruit them ---- */
const set=(c,x,y)=>{c.x=x;c.y=y;c.el.style.transform=`translate(${x}px,${y}px)`};
const move=(c,x,y,ms)=>{const x0=c.x,y0=c.y;return tween(ms,k=>set(c,x0+(x-x0)*k,y0+(y-y0)*k))};
const swarm=Array.from({length:6},(_,i)=>{
  const e=el('div','cur',stage);
  e.innerHTML='<svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1l15 9-7 1.5L5.5 19z" fill="var(--c)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="tag"></span>';
  const c={el:e,tag:e.lastChild,busy:false,a:.21+i*.07,b:.17+i*.05,p:i*1.7};
  set(c,W/2,H/2);return c});
(function wander(t){for(const c of swarm)if(!c.busy){
  const tx=W/2+Math.cos(t/1000*c.a*3+c.p)*W*.4,ty=H/2+Math.sin(t/1000*c.b*3+c.p*2)*H*.42;
  set(c,c.x+(tx-c.x)*.03,c.y+(ty-c.y)*.03)}
  requestAnimationFrame(wander)})(0);
async function acquire(n){for(;;){const free=swarm.filter(c=>!c.busy);
  if(free.length>=n){const g=free.slice(0,n);g.forEach(c=>c.busy=true);return g}await sleep(200)}}

/* ---- card placement: random spot with no overlap, evict oldest finished cards when full ---- */
const cards=[{x:W-190,y:14,w:190,h:215}]; // legend area, never evicted (no .done)
const hit=(a,b,m=8)=>a.x<b.x+b.w+m&&b.x<a.x+a.w+m&&a.y<b.y+b.h+m&&b.y<a.y+a.h+m;
async function place(r){for(let i=1;;i++){
  r.x=22+Math.random()*(W-30-r.w)|0;r.y=22+Math.random()*(H-30-r.h)|0;
  const hits=cards.filter(c=>hit(c,r));
  // free spot first; after 60 misses, take a spot covering only finished cards and evict just those
  if(!hits.length||(i>60&&hits.every(c=>c.done))){
    for(const old of hits){cards.splice(cards.indexOf(old),1);old.el.classList.add('out');setTimeout(()=>old.el.remove(),400)}
    console.assert(r.x>=14&&r.x+r.w<=W&&r.y+r.h<=H&&!cards.some(c=>hit(c,r)),'bad placement',r);cards.push(r);return}
  if(i%80==0)await sleep(300)}}

/* ---- the one entry point: wire a real TikTok gift event to this later ---- */
async function onGift({name,avatar,gift,count=1}){
  const T=GIFTS[gift];if(!T)return;
  addTally(gift,count);
  const w=T.w,h=Math.round(w*1.25),r={w,h};
  const ws=await acquire(T.n),[a,b=a,c=b]=ws;
  const sel=el('div','sel',stage),badge=el('span','',sel);sel.style.display='none';
  try{
    await place(r);const {x,y}=r;
    ws.forEach(q=>{q.el.classList.add('busy');q.el.style.setProperty('--c',T.color);q.tag.textContent=name});

    // 1. drag out the frame
    await move(a,x,y,450);click(900,.04);
    sel.style.cssText=`left:${x}px;top:${y}px;border-color:${T.color}`;badge.style.background=T.color;
    await tween(550,k=>{sel.style.width=w*k+'px';sel.style.height=h*k+'px';badge.textContent=`${w*k|0} × ${h*k|0}`;set(a,x+w*k,y+h*k)});
    click(700,.04);
    const card=r.el=el('div','card',stage);
    card.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;--w:${w}px;--c:${T.color}`;
    card.innerHTML='<div class="av"><img alt=""></div><div class="nm"><span></span></div><div class="gf"></div><div class="crown">👑</div>';
    const av=card.children[0],nm=card.children[1],gf=card.children[2];
    card.offsetWidth;card.classList.add('in');

    // 2. draw the avatar circle, photo sweeps in top to bottom
    const d=w*.56,ax=(w-d)/2,ay=w*.1;
    const drawAv=async()=>{
      av.style.left=ax+'px';av.style.top=ay+'px';
      await move(b,x+ax,y+ay,350);click(900,.04);
      await tween(450,k=>{av.style.width=av.style.height=d*k+'px';set(b,x+ax+d*k,y+ay+d*k)});
      av.firstChild.src=avatar;av.classList.add('show');click(700,.04);await sleep(450)};

    // 3. type the name with an I-beam
    const typeNm=async()=>{
      await move(c,x+w/2,y+w*.78,350);c.el.classList.add('ibeam');nm.classList.add('typing');
      for(const g of seg(name)){
        nm.firstChild.textContent+=g;click(1500+Math.random()*700,.02);
        const s=stage.getBoundingClientRect(),q=nm.firstChild.getBoundingClientRect(),z=s.width/W;
        set(c,Math.min((q.right-s.left)/z,x+w*.94)+3,(q.top+q.height/2-s.top)/z);
        await sleep(55+Math.random()*60)}
      nm.classList.remove('typing');c.el.classList.remove('ibeam')};

    if(T.n==1){await drawAv();await typeNm()}
    else await Promise.all([drawAv(),typeNm(),T.n>2&&move(a,x+w/2,y+w*1.05,500)]);

    // 4. gift badge pops; the biggest prize gets a crown and a victory lap
    gf.textContent=`${T.icon} ${T.label} ×${count}`;gf.classList.add('pop');click(1200,.09);
    if(T.top){
      await move(a,x+w/2,y+ay-w*.25,350);card.lastChild.classList.add('on');click(500,.15);
      await move(a,x+w/2,y+ay,250);
      card.classList.add('glow');const from=ws.map(q=>[q.x,q.y]);
      await tween(1600,k=>ws.forEach((q,i)=>{const t=k*Math.PI*4+i*2.09,m=Math.min(1,k*6),
        ox=x+w/2+Math.cos(t)*w*.62,oy=y+h/2+Math.sin(t)*h*.58;
        set(q,from[i][0]+(ox-from[i][0])*m,from[i][1]+(oy-from[i][1])*m)}))}
    else await sleep(300);
  }finally{
    sel.remove();r.done=true;
    ws.forEach(q=>{q.busy=false;q.tag.textContent='';q.el.className='cur';q.el.style.removeProperty('--c')});
  }
}

/* ---- demo data (stands in for real TikTok events) ---- */
const NAMES=['น้ำหวาน','ปลาทอง','มะลิ','Tonkla','Mook','Beam_99','Kenji','Lina','ข้าวปั้น','Max','Fah','โอ๊ต'];
function fakeAvatar(name){const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');
  let hue=0;for(const ch of name)hue=(hue*31+ch.codePointAt(0))%360;
  const gr=g.createLinearGradient(0,0,160,160);gr.addColorStop(0,`hsl(${hue} 80% 62%)`);gr.addColorStop(1,`hsl(${(hue+70)%360} 80% 42%)`);
  g.fillStyle=gr;g.fillRect(0,0,160,160);g.fillStyle='#fff';g.font='bold 84px system-ui';g.textAlign='center';g.textBaseline='middle';
  g.fillText(seg(name)[0].toUpperCase(),80,86);return c.toDataURL()}
function demo(gift){const name=NAMES[Math.random()*NAMES.length|0];
  onGift({name,avatar:fakeAvatar(name),gift,count:GIFTS[gift].coins<10?1+(Math.random()*8|0):1})}
const panel=document.getElementById('panel');
for(const k of ids.slice().reverse()){const b=document.createElement('button');
  b.dataset.t=k;b.textContent=GIFTS[k].icon;b.title=GIFTS[k].label;b.setAttribute('aria-label',GIFTS[k].label);panel.prepend(b)}
panel.addEventListener('click',e=>{if(e.target.dataset.t)demo(e.target.dataset.t)});
const ODDS=[.45,.25,.14,.09,.05,.02]; // cheap gifts come often, the lion rarely
(async function auto(){for(;;){await sleep(900+Math.random()*1800);
  if(document.getElementById('auto').checked){let p=Math.random();demo(ids.find((_,i)=>(p-=ODDS[i])<0)||ids[0])}}})();
</script>
</body>
</html>
